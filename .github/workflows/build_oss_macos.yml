name: Build OSS macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - "zh-cn-i18n*"

permissions:
  contents: read

concurrency:
  group: build-oss-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WARP_SKIP_COMMON_SKILLS_INSTALL: "1"

jobs:
  build_macos_app:
    name: Build WarpOss.dmg
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --find metal
          rustup show
          cargo --version
        shell: bash

      - name: Install packaging tools
        run: |
          script/install_cargo_bundle
          brew install create-dmg
        shell: bash

      - name: Build unsigned macOS OSS DMG
        id: bundle
        run: |
          dmg_suffix="${RUNNER_ARCH}-${GITHUB_SHA::7}"

          ./script/bundle \
            --channel oss \
            --nosign \
            --nouniversal \
            --dmg-name-suffix "$dmg_suffix"

          dmg_path="$(find target -path "*/bundle/osx/WarpOss-${dmg_suffix}.dmg" -type f ! -path "*/dmg/*" | head -n 1)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG produced" >&2
            exit 1
          fi
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WarpOss-macos-dmg-${{ github.sha }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 14
