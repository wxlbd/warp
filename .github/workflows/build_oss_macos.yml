name: Build OSS macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - "zh-cn-i18n*"

permissions:
  contents: write

concurrency:
  group: build-oss-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WARP_SKIP_COMMON_SKILLS_INSTALL: "1"

jobs:
  build_macos_app:
    name: Build WarpOss.dmg
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --find metal
          rustup show
          cargo --version
        shell: bash

      - name: Install packaging tools
        run: |
          script/install_cargo_bundle
          script/install_cargo_release_deps --no-build-deps
          brew install create-dmg protobuf
          cargo about --version
          protoc --version
        shell: bash

      - name: Build unsigned macOS OSS DMG
        id: bundle
        run: |
          dmg_suffix="${RUNNER_ARCH}-${GITHUB_SHA::7}"

          ./script/bundle \
            --channel oss \
            --nosign \
            --nouniversal \
            --dmg-name-suffix "$dmg_suffix"

          dmg_path="$(find target -path "*/bundle/osx/WarpOss-${dmg_suffix}.dmg" -type f ! -path "*/dmg/*" | head -n 1)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG produced" >&2
            exit 1
          fi
          release_dmg_path="${RUNNER_TEMP}/WarpOss-macos-${RUNNER_ARCH}.dmg"
          cp "$dmg_path" "$release_dmg_path"

          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "release_dmg_path=$release_dmg_path" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload DMG artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: WarpOss-macos-dmg-${{ github.sha }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: oss-macos-latest
          RELEASE_NAME: WarpOss macOS latest
          RELEASE_DMG_PATH: ${{ steps.bundle.outputs.release_dmg_path }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

          release_notes="${RUNNER_TEMP}/oss-macos-release-notes.md"
          cat > "$release_notes" <<EOF
          Automatically published WarpOss macOS DMG.

          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file "$release_notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file "$release_notes" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$RELEASE_DMG_PATH" --clobber
        shell: bash
